<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Timer</title>
<style>
:root{
  --work:#e0645a; --retrieval:#5a8fe0; --break:#5ac98a;
  --bg:#faf9f7; --card:#ffffff; --text:#2b2b2b; --sub:#6b6b6b; --border:#eae7e2;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --card:#242320; --text:#f0eee9; --sub:#a8a49c; --border:#38352f;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#242320; --text:#f0eee9; --sub:#a8a49c; --border:#38352f;
}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; align-items:center; justify-content:center;
  min-height:100%;
}
.wrap{ width:100%; max-width:420px; padding:24px 20px; }
.card{
  background:var(--card); border:1px solid var(--border); border-radius:20px;
  padding:28px 24px; text-align:center; transition:box-shadow .3s;
}
.phase-label{ font-size:14px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
.time{ font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; margin:8px 0 18px; }
.dots{ display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
.dot{ width:10px; height:10px; border-radius:50%; background:var(--border); }
.dot.active{ background:currentColor; }
.controls{ display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
button{
  border:none; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:600;
  cursor:pointer; transition:opacity .15s; font-family:inherit;
}
button:active{ opacity:.7; }
.btn-primary{ background:var(--text); color:var(--bg); flex:1; }
.btn-secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
.count-row{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-top:22px; padding-top:18px; border-top:1px solid var(--border);
}
.count-label{ font-size:13px; color:var(--sub); }
.count-val{ font-size:20px; font-weight:700; min-width:28px; }
.count-btn{
  width:30px; height:30px; border-radius:50%; border:1px solid var(--border);
  background:transparent; color:var(--text); font-size:16px; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.settings{ margin-top:14px; font-size:12px; color:var(--sub); cursor:pointer; text-decoration:underline; }
.settings-panel{ display:none; margin-top:14px; text-align:left; font-size:13px; }
.settings-panel.open{ display:block; }
.set-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.set-row input{
  width:60px; padding:6px 8px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:13px; text-align:center;
}
.task-card{ margin-top:16px; text-align:left; }
.task-title{ font-size:14px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--sub); margin-bottom:14px; }
.task-form{ display:flex; gap:8px; margin-bottom:14px; }
.task-form input{
  padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:14px; font-family:inherit;
}
#taskGoal{ flex:1; min-width:0; }
#taskEstimate{ width:52px; text-align:center; }
.task-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.task-row:last-child{ border-bottom:none; }
.task-info{ flex:1; min-width:0; }
.task-name{ font-size:14px; font-weight:600; overflow-wrap:anywhere; }
.task-name.done{ text-decoration:line-through; color:var(--sub); }
.task-progress{ font-size:12px; color:var(--sub); margin-top:2px; }
.task-actions{ display:flex; gap:6px; flex-shrink:0; }
.task-btn{
  width:28px; height:28px; border-radius:50%; border:1px solid var(--border);
  background:transparent; color:var(--text); font-size:14px; padding:0; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.task-btn.del{ color:var(--work); border-color:var(--work); }
.task-empty{ font-size:13px; color:var(--sub); text-align:center; padding:6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="phase-label" id="phaseLabel">WORK</div>
    <div class="time" id="timeDisplay">25:00</div>
    <div class="dots" id="dots">
      <div class="dot active" data-p="0"></div>
      <div class="dot" data-p="1"></div>
      <div class="dot" data-p="2"></div>
    </div>
    <div class="controls">
      <button class="btn-primary" id="startBtn">Start</button>
      <button class="btn-secondary" id="skipBtn">Skip</button>
      <button class="btn-secondary" id="resetBtn">Reset</button>
    </div>
    <div class="count-row">
      <span class="count-label">Pomodoros done</span>
      <button class="count-btn" id="decCount">−</button>
      <span class="count-val" id="countVal">0</span>
      <button class="count-btn" id="incCount">+</button>
    </div>
    <div class="settings" id="settingsToggle">Settings</div>
    <div class="settings-panel" id="settingsPanel">
      <div class="set-row"><span>Work (min)</span><input type="number" id="setWork" min="1" max="90"></div>
      <div class="set-row"><span>Active retrieval (min)</span><input type="number" id="setRetrieval" min="1" max="90"></div>
      <div class="set-row"><span>Break (min)</span><input type="number" id="setBreak" min="1" max="90"></div>
      <div class="set-row">
        <span>Chime volume</span>
        <input type="range" id="setVolume" min="0" max="100" step="1" style="width:110px;">
      </div>
    </div>
  </div>

  <div class="card task-card">
    <div class="task-title">Tasks</div>
    <div class="task-form">
      <input id="taskGoal" type="text" placeholder="Goal" maxlength="60">
      <input id="taskEstimate" type="number" min="1" max="20" placeholder="🍅">
      <button class="btn-secondary" id="addTaskBtn">Add</button>
    </div>
    <div id="taskList"></div>
  </div>
</div>

<script>
const phases = [
  { key:'work', label:'WORK', color:'var(--work)', mins:25 },
  { key:'retrieval', label:'ACTIVE RETRIEVAL', color:'var(--retrieval)', mins:5 },
  { key:'break', label:'BREAK', color:'var(--break)', mins:5 }
];

let state = {
  phaseIndex: 0,
  remaining: phases[0].mins * 60,
  running: false,
  count: 0,
  volume: 70
};
let timerId = null;
let endTime = 0; // wall-clock ms when the current phase ends (only while running)

const phaseLabel = document.getElementById('phaseLabel');
const timeDisplay = document.getElementById('timeDisplay');
const card = document.getElementById('card');
const startBtn = document.getElementById('startBtn');
const countVal = document.getElementById('countVal');
const dots = document.querySelectorAll('.dot');

function save(){
  try{
    localStorage.setItem('pomo_state', JSON.stringify({
      phaseIndex: state.phaseIndex, remaining: state.remaining, count: state.count,
      volume: state.volume, durations: phases.map(p=>p.mins)
    }));
  }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem('pomo_state');
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.durations){ d.durations.forEach((m,i)=>{ if(phases[i]) phases[i].mins = m; }); }
    if(typeof d.count === 'number') state.count = d.count;
    if(typeof d.phaseIndex === 'number') state.phaseIndex = d.phaseIndex;
    if(typeof d.remaining === 'number') state.remaining = d.remaining;
    if(typeof d.volume === 'number') state.volume = d.volume;
  }catch(e){}
}

function fmt(s){
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

function render(){
  const p = phases[state.phaseIndex];
  phaseLabel.textContent = p.label;
  phaseLabel.style.color = p.color;
  card.style.boxShadow = '0 0 0 2px ' + p.color + '33';
  timeDisplay.textContent = fmt(state.remaining);
  timeDisplay.style.color = p.color;
  dots.forEach((d,i)=>{
    d.classList.toggle('active', i === state.phaseIndex);
    d.style.color = p.color;
  });
  countVal.textContent = state.count;
  startBtn.textContent = state.running ? 'Pause' : 'Start';
  document.getElementById('setWork').value = phases[0].mins;
  document.getElementById('setRetrieval').value = phases[1].mins;
  document.getElementById('setBreak').value = phases[2].mins;
  document.getElementById('setVolume').value = state.volume;
}

function tick(){
  // Derive remaining time from the real clock so background-tab throttling can't cause drift
  const left = Math.ceil((endTime - Date.now()) / 1000);
  if(left > 0){
    if(left !== state.remaining){
      state.remaining = left;
      render();
      save();
    }
  } else {
    state.remaining = 0;
    advancePhase();
  }
}

let audioCtx = null;
function playChime(){
  try{
    if(state.volume <= 0) return;
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const peak = 0.25 * (state.volume / 100);
    const now = audioCtx.currentTime;
    [0, 0.18].forEach((offset, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 0 ? 880 : 1175;
      gain.gain.setValueAtTime(0, now + offset);
      gain.gain.linearRampToValueAtTime(peak, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.32);
    });
  }catch(e){}
}

function advancePhase(){
  playChime();
  const wasBreak = phases[state.phaseIndex].key === 'break';
  state.phaseIndex = (state.phaseIndex + 1) % phases.length;
  state.remaining = phases[state.phaseIndex].mins * 60;
  if(wasBreak) state.count++;
  if(state.running) endTime = Date.now() + state.remaining * 1000;
  render();
  save();
}

function startPause(){
  state.running = !state.running;
  if(state.running){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }catch(e){}
    endTime = Date.now() + state.remaining * 1000;
    timerId = setInterval(tick, 250);
  } else {
    clearInterval(timerId);
  }
  render();
}

document.addEventListener('visibilitychange', ()=>{ if(state.running && !document.hidden) tick(); });
document.getElementById('startBtn').addEventListener('click', startPause);
document.getElementById('skipBtn').addEventListener('click', ()=>{ advancePhase(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.running = false; clearInterval(timerId);
  state.remaining = phases[state.phaseIndex].mins * 60;
  render(); save();
});
document.getElementById('incCount').addEventListener('click', ()=>{ state.count++; render(); save(); });
document.getElementById('decCount').addEventListener('click', ()=>{ state.count = Math.max(0, state.count-1); render(); save(); });

document.getElementById('settingsToggle').addEventListener('click', ()=>{
  document.getElementById('settingsPanel').classList.toggle('open');
});
function bindDurationInput(id, idx){
  document.getElementById(id).addEventListener('change', (e)=>{
    const val = Math.max(1, parseInt(e.target.value) || 1);
    phases[idx].mins = val;
    if(state.phaseIndex === idx && !state.running){
      state.remaining = val * 60;
    }
    render(); save();
  });
}
bindDurationInput('setWork', 0);
bindDurationInput('setRetrieval', 1);
bindDurationInput('setBreak', 2);

const volumeInput = document.getElementById('setVolume');
volumeInput.addEventListener('input', (e)=>{
  state.volume = parseInt(e.target.value) || 0;
  save();
});
volumeInput.addEventListener('change', ()=>{
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  playChime();
});

let tasks = [];

function saveTasks(){
  try{ localStorage.setItem('pomo_tasks', JSON.stringify(tasks)); }catch(e){}
}
function loadTasks(){
  try{
    const raw = localStorage.getItem('pomo_tasks');
    if(raw) tasks = JSON.parse(raw) || [];
  }catch(e){ tasks = []; }
}

function renderTasks(){
  const list = document.getElementById('taskList');
  if(tasks.length === 0){
    list.innerHTML = '<div class="task-empty">No goals yet — add one above.</div>';
    return;
  }
  list.innerHTML = tasks.map(t => {
    const done = t.done >= t.estimate;
    return `
      <div class="task-row" data-id="${t.id}">
        <div class="task-info">
          <div class="task-name${done ? ' done' : ''}">${escapeHtml(t.goal)}</div>
          <div class="task-progress">${done ? 'Done' : (t.done + ' / ' + t.estimate)} 🍅</div>
        </div>
        <div class="task-actions">
          ${done ? '' : '<button class="task-btn" data-action="inc">+1</button>'}
          <button class="task-btn del" data-action="del">×</button>
        </div>
      </div>`;
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('addTaskBtn').addEventListener('click', addTask);
document.getElementById('taskGoal').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addTask(); });
document.getElementById('taskEstimate').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addTask(); });

function addTask(){
  const goalInput = document.getElementById('taskGoal');
  const estInput = document.getElementById('taskEstimate');
  const goal = goalInput.value.trim();
  const estimate = Math.max(1, parseInt(estInput.value) || 1);
  if(!goal) return;
  tasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), goal, estimate, done: 0 });
  goalInput.value = '';
  estInput.value = '';
  goalInput.focus();
  saveTasks();
  renderTasks();
}

document.getElementById('taskList').addEventListener('click', (e)=>{
  const btn = e.target.closest('.task-btn');
  if(!btn) return;
  const row = e.target.closest('.task-row');
  const id = row.getAttribute('data-id');
  const task = tasks.find(t => t.id === id);
  if(!task) return;
  if(btn.dataset.action === 'inc'){
    task.done = Math.min(task.estimate, task.done + 1);
  } else if(btn.dataset.action === 'del'){
    tasks = tasks.filter(t => t.id !== id);
  }
  saveTasks();
  renderTasks();
});

load();
render();
loadTasks();
renderTasks();
</script>
</body>
</html>
